<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bauablauf Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Bauablauf-Zeitstrahl für MDH- und freshhaus-Projekte erstellen und als HTML oder PDF exportieren.">
<!-- inline data-URI favicon: a timeline segment with the "Heute" dot, in the
     MDH copper. Inline so the hosted page needs no extra request or file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b2a29'/%3E%3Cpath d='M4 16h24' stroke='%233f3d3c' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M4 16h13' stroke='%23a3775c' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='17' cy='16' r='4.5' fill='%23c7a688'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* only needed for the freshhaus panel theme; the MDH panel keeps the
     system stack it has always used. Loaded from freshhaus.ch exactly as
     the generated freshhaus timeline does, with a solid fallback. */
  @font-face { font-family: 'Obibok'; src: url('https://www.freshhaus.ch/_assets/535baf2d2c5e492bfcadf9e13e6ea7e1/Fonts/Obibok-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Obibok'; src: url('https://www.freshhaus.ch/_assets/535baf2d2c5e492bfcadf9e13e6ea7e1/Fonts/Obibok-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }

  /* MDH (default): dark anthracite + copper, mirroring the MDH timeline */
  :root {
    --panel-bg: #2b2a29;
    --panel-bg-2: #393737;
    --panel-bg-3: #464343;
    --panel-line: #3f3d3c;
    --panel-text: #f1ece7;
    --panel-muted: #9a938d;
    --panel-accent: #a3775c;
    --panel-accent-bright: #c7a688;
    --panel-active: #5c4636;
    --panel-on-accent: #ffffff;
    --panel-on-bright: #2b2a29;
    --panel-preview-bg: #000000;
    --panel-frame-bg: #2b2a29;
    --panel-font: -apple-system, 'Segoe UI', Arial, sans-serif;
  }

  /* freshhaus: the same values the generated freshhaus timeline uses, so
     the editor reads as the same product as the page it is producing.
     --panel-accent is the deep lime (#5c7d0c) rather than the signature
     #96c814: the bright lime is a background colour in that palette and
     white text on it is unreadable, so the bright one is used for exactly
     that — a light fill carrying dark text. */
  body.theme-fh {
    --panel-bg: #ffffff;
    --panel-bg-2: #f5f6f1;
    --panel-bg-3: #ebeee2;
    --panel-line: #e2e4db;
    --panel-text: #1d1e1c;
    --panel-muted: #6b6d67;
    --panel-accent: #5c7d0c;
    --panel-accent-bright: #96c814;
    --panel-active: #5c7d0c;
    --panel-on-accent: #ffffff;
    --panel-on-bright: #1d1e1c;
    --panel-preview-bg: #e7eade;
    --panel-frame-bg: #ffffff;
    --panel-font: 'Obibok', -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--panel-font);
    background: var(--panel-bg);
    color: var(--panel-text);
    transition: background 0.25s ease, color 0.25s ease;
  }
  .app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  .panel {
    width: 380px;
    min-width: 320px;
    flex-shrink: 0;
    overflow-y: auto;
    background: var(--panel-bg);
    border-right: 1px solid var(--panel-line);
    padding: 20px 20px 40px;
  }
  .panel h1 {
    font-size: 16px;
    margin: 0 0 20px;
    color: var(--panel-text);
  }
  .field-group {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--panel-line);
  }
  .field-group:last-child { border-bottom: none; }
  .field-group h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--panel-muted);
    margin: 0 0 12px;
  }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--panel-text);
    margin-bottom: 4px;
  }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  input[type="text"], select {
    width: 100%;
    background: var(--panel-bg-2);
    border: 1px solid var(--panel-line);
    color: var(--panel-text);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 13px;
    font-family: inherit;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .style-toggle {
    display: flex;
    gap: 8px;
  }
  .style-toggle button {
    flex: 1;
    padding: 9px 8px;
    border-radius: 6px;
    border: 1px solid var(--panel-line);
    background: var(--panel-bg-2);
    color: var(--panel-muted);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .style-toggle button.active {
    border-color: var(--panel-accent);
    color: var(--panel-on-accent);
    background: var(--panel-active);
  }
  .mode-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mode-toggle button {
    flex: 1;
    padding: 7px 6px;
    border-radius: 6px;
    border: 1px solid var(--panel-line);
    background: var(--panel-bg-2);
    color: var(--panel-muted);
    font-size: 12px;
    cursor: pointer;
  }
  .mode-toggle button.active {
    border-color: var(--panel-accent);
    color: var(--panel-on-accent);
    background: var(--panel-active);
  }
  .milestone-block {
    background: var(--panel-bg-2);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .milestone-block .name {
    font-size: 12.5px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--panel-text);
  }
  .kw-label { font-size: 10.5px; color: var(--panel-muted); margin-bottom: 2px; }
  .downloads {
    display: flex;
    gap: 10px;
  }
  .downloads button {
    flex: 1;
    padding: 11px 8px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  #btn-html { background: var(--panel-accent); color: var(--panel-on-accent); }
  #btn-pdf { background: var(--panel-accent-bright); color: var(--panel-on-bright); }
  .downloads button:active { transform: scale(0.98); }
  .downloads button:disabled { opacity: 0.6; cursor: default; }
  input[type="range"] {
    width: 100%;
    accent-color: var(--panel-accent);
  }
  .reset-btn {
    margin-top: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--panel-line);
    background: var(--panel-bg-2);
    color: var(--panel-muted);
    font-size: 11.5px;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--panel-text); border-color: var(--panel-accent); }
  .preview {
    flex: 1;
    background: var(--panel-preview-bg);
    position: relative;
    transition: background 0.25s ease;
  }
  .preview iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    /* matches the timeline being previewed, so re-rendering does not flash
       white behind the dark MDH page */
    background: var(--panel-frame-bg);
  }
</style>
</head>
<body>

<div class="app">
  <aside class="panel">
    <h1>Bauablauf Editor</h1>

    <div class="field-group">
      <h2>Design</h2>
      <div class="style-toggle">
        <button id="style-mdh" class="active" type="button">MDH</button>
        <button id="style-fh" type="button">freshhaus</button>
      </div>
    </div>

    <div class="field-group">
      <h2>Projekt</h2>
      <div class="field" id="field-project-name">
        <div><div class="kw-label">Projektname</div><input type="text" id="input-project-name" value="Musterprojekt"></div>
      </div>
      <div class="row2" style="margin-top:12px;">
        <div><div class="kw-label">Anrede</div><input type="text" id="input-anschrift-1" value="Familie"></div>
        <div><div class="kw-label">Name</div><input type="text" id="input-anschrift-2" value="Muster"></div>
      </div>
    </div>

    <div class="field-group">
      <h2>Meilensteine (Kalenderwoche &amp; Jahr)</h2>

      <div class="milestone-block">
        <div class="name">Werkvertrag</div>
        <div class="row2">
          <div><div class="kw-label">KW</div><input type="text" inputmode="numeric" id="ms-werkvertrag-week" value="20"></div>
          <div><div class="kw-label">Jahr</div><input type="text" inputmode="numeric" id="ms-werkvertrag-year" value="2026"></div>
        </div>
      </div>

      <div class="milestone-block">
        <div class="name">Best&auml;tigung</div>
        <div class="row2">
          <div><div class="kw-label">KW</div><input type="text" inputmode="numeric" id="ms-bestaetigung-week" value="40"></div>
          <div><div class="kw-label">Jahr</div><input type="text" inputmode="numeric" id="ms-bestaetigung-year" value="2026"></div>
        </div>
      </div>

      <div class="milestone-block">
        <div class="name">Planversand</div>
        <div class="row2">
          <div><div class="kw-label">KW</div><input type="text" inputmode="numeric" id="ms-planversand-week" value="4"></div>
          <div><div class="kw-label">Jahr</div><input type="text" inputmode="numeric" id="ms-planversand-year" value="2027"></div>
        </div>
      </div>

      <div class="milestone-block">
        <div class="name">Baubeginn</div>
        <div class="row2">
          <div><div class="kw-label">KW</div><input type="text" inputmode="numeric" id="ms-baubeginn-week" value="10"></div>
          <div><div class="kw-label">Jahr</div><input type="text" inputmode="numeric" id="ms-baubeginn-year" value="2027"></div>
        </div>
      </div>
    </div>

    <div class="field-group">
      <h2>Jahreswechsel-Marker</h2>
      <div class="milestone-block">
        <div class="field">
          <label for="year-label-dx">Text horizontal verschieben</label>
          <input type="range" id="year-label-dx" min="-128" max="128" step="1" value="0">
        </div>
        <div class="field">
          <label for="year-label-dy">Text nach unten verschieben</label>
          <input type="range" id="year-label-dy" min="0" max="60" step="1" value="0">
        </div>
        <button type="button" id="year-label-reset" class="reset-btn">Zur&uuml;cksetzen</button>
      </div>
    </div>

    <div class="field-group">
      <h2>Bemusterungstage</h2>
      <div class="mode-toggle">
        <button id="mode-single" type="button">Einzelne KW</button>
        <button id="mode-range" class="active" type="button">KW-Bereich</button>
      </div>
      <div class="milestone-block">
        <div class="row2">
          <div><div class="kw-label" id="bem-start-label">Start KW</div><input type="text" inputmode="numeric" id="bem-start-week" value="26"></div>
          <div><div class="kw-label">Jahr</div><input type="text" inputmode="numeric" id="bem-start-year" value="2026"></div>
        </div>
        <div class="row2" id="bem-end-row" style="margin-top:8px;">
          <div><div class="kw-label">End KW</div><input type="text" inputmode="numeric" id="bem-end-week" value="30"></div>
          <div><div class="kw-label">Jahr</div><input type="text" inputmode="numeric" id="bem-end-year" value="2026"></div>
        </div>
        <div class="field" style="margin-top:12px;">
          <label for="bem-label-dx">Text horizontal verschieben</label>
          <input type="range" id="bem-label-dx" min="-128" max="128" step="1" value="0">
        </div>
        <div class="field">
          <label for="bem-label-dy">Text nach unten verschieben</label>
          <input type="range" id="bem-label-dy" min="0" max="20" step="1" value="0">
        </div>
        <button type="button" id="bem-label-reset" class="reset-btn">Zur&uuml;cksetzen</button>
      </div>
    </div>

    <div class="field-group">
      <h2>Export</h2>
      <div class="downloads">
        <button id="btn-html" type="button">&#8595; HTML</button>
        <button id="btn-pdf" type="button">&#8595; PDF</button>
      </div>
    </div>
  </aside>

  <main class="preview">
    <iframe id="preview-frame" title="Vorschau"></iframe>
  </main>
</div>

<script>
(function () {

  /* =====================================================================
     CORE DATE MATH — shared by the editor AND embedded into every file
     the editor generates (each exported HTML file is fully standalone).
     ===================================================================== */

  function isoWeekToMonday(year, week) {
    const jan4 = new Date(Date.UTC(year, 0, 4));
    const jan4Day = jan4.getUTCDay() || 7;
    const week1Monday = new Date(jan4);
    week1Monday.setUTCDate(jan4.getUTCDate() - (jan4Day - 1));
    const target = new Date(week1Monday);
    target.setUTCDate(week1Monday.getUTCDate() + (week - 1) * 7);
    return target.getTime();
  }

  function weeksBetween(msA, msB) {
    return Math.round((msB - msA) / (7 * 86400000));
  }

  const MONTHS_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  function monthLabelDE(ms) {
    const d = new Date(ms);
    const day = d.getUTCDate();
    const month = MONTHS_DE[d.getUTCMonth()];
    const bucket = day <= 10 ? 'Anfang' : (day <= 20 ? 'Mitte' : 'Ende');
    return bucket + ' ' + month;
  }

  /* the JS that gets embedded verbatim inside every generated file
     (drag-scroll, reveal-on-scroll, keyboard nav, today-dot + marker
     positioning with auto label-avoidance so a marker's text never
     sits on top of a milestone node) */
  const RUNTIME_JS = function (opts) {
    return `
  (function () {
    const wrap = document.getElementById('wrap');
    const track = document.getElementById('track');
    const fill = document.getElementById('fill');
    const todayDot = document.getElementById('today-dot');
    const todayBadge = document.getElementById('today-badge');
    const yearMarker = document.getElementById('year-marker');
    const bemusterungMarker = document.getElementById('bemusterung-marker');
    const yearLabel = yearMarker ? yearMarker.querySelector('.ylabel') : null;
    const phase1Step = document.getElementById('phase-ausarbeitung');
    const phase1Card = document.getElementById('phase-ausarbeitung-card');
    const phase1Stem = document.getElementById('phase-ausarbeitung-stem');
    const bemusterungLabel = bemusterungMarker ? bemusterungMarker.querySelector('.ylabel') : null;
    const bemusterungEndTick = bemusterungMarker ? bemusterungMarker.querySelector('.rtick.end') : null;
    const bemusterungLine = bemusterungMarker ? bemusterungMarker.querySelector('.rline') : null;
    const bemusterungStem = bemusterungMarker ? bemusterungMarker.querySelector('.rstem') : null;
    const steps = Array.from(document.querySelectorAll('.step'));
    const milestoneEls = Array.from(document.querySelectorAll('.milestone'));
    const nodes = milestoneEls.map(m => m.querySelector('.node'));
    const milestoneDates = milestoneEls.map(m => ({
      year: parseInt(m.dataset.year, 10),
      week: parseInt(m.dataset.week, 10)
    }));
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    /* true only inside the editor's own live-preview iframe and the
       hidden frame used for PDF capture — both inject a tiny marker
       script (window.__BAUABLAUF_SUPPRESS_INTRO__) ahead of this one
       specifically to flip this off. Deliberately NOT based on "am I
       in an iframe" (window.self !== window.top): the downloaded file
       may itself be viewed inside an iframe — a preview panel, an
       embed on someone's intranet page — and that must still animate,
       so only this explicit, editor-set flag suppresses it. */
    const suppressIntro = typeof window.__BAUABLAUF_SUPPRESS_INTRO__ !== 'undefined' && window.__BAUABLAUF_SUPPRESS_INTRO__ === true;

    let isDown = false, startX = 0, startScroll = 0;
    wrap.addEventListener('pointerdown', (e) => {
      /* mouse only. On a touch screen the browser already scrolls the
         wrapper natively (with momentum); running this handler too would
         apply a second, competing scroll on every move — the timeline
         then travels at roughly double speed and stutters against the
         native fling. Pen/touch fall through to the native behaviour. */
      if (e.pointerType && e.pointerType !== 'mouse') return;
      isDown = true;
      wrap.classList.add('dragging');
      startX = e.clientX;
      startScroll = wrap.scrollLeft;
    });
    window.addEventListener('pointermove', (e) => {
      if (!isDown) return;
      wrap.scrollLeft = startScroll - (e.clientX - startX);
    });
    window.addEventListener('pointerup', () => { isDown = false; wrap.classList.remove('dragging'); });
    wrap.addEventListener('pointerleave', () => { isDown = false; wrap.classList.remove('dragging'); });

    function step(dir) {
      wrap.scrollBy({ left: dir * 280, behavior: prefersReduced ? 'auto' : 'smooth' });
    }
    document.getElementById('btn-prev').addEventListener('click', () => step(-1));
    document.getElementById('btn-next').addEventListener('click', () => step(1));

    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('in-view');
        });
      }, { root: wrap, threshold: 0.3 });
      steps.forEach(s => io.observe(s));
    } else {
      steps.forEach(s => s.classList.add('in-view'));
    }

    nodes.forEach((node, i) => {
      node.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && nodes[i + 1]) {
          e.preventDefault();
          nodes[i + 1].focus();
          nodes[i + 1].scrollIntoView({ behavior: prefersReduced ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
        } else if (e.key === 'ArrowLeft' && nodes[i - 1]) {
          e.preventDefault();
          nodes[i - 1].focus();
          nodes[i - 1].scrollIntoView({ behavior: prefersReduced ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
        }
      });
    });

    function isoWeekInfo(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return { week: week, isoDay: dayNum };
    }

    function isoWeekToMonday(year, week) {
      const jan4 = new Date(Date.UTC(year, 0, 4));
      const jan4Day = jan4.getUTCDay() || 7;
      const week1Monday = new Date(jan4);
      week1Monday.setUTCDate(jan4.getUTCDate() - (jan4Day - 1));
      const target = new Date(week1Monday);
      target.setUTCDate(week1Monday.getUTCDate() + (week - 1) * 7);
      return target.getTime();
    }

    const milestoneMs = milestoneDates.map(d => isoWeekToMonday(d.year, d.week));
    ${opts.yearMarkerJs}
    ${opts.bemusterungJs}
    ${opts.bemLabelOffsetJs}
    ${opts.yearLabelOffsetJs}

    const LABEL_MIN_GAP = 120; // px — keep marker text at least this far from any milestone node

    function interpolateX(targetMs, points) {
      if (targetMs <= points[0].ms) return points[0].x;
      if (targetMs >= points[points.length - 1].ms) return points[points.length - 1].x;
      for (let i = 0; i < points.length - 1; i++) {
        if (targetMs >= points[i].ms && targetMs <= points[i + 1].ms) {
          const span = points[i + 1].ms - points[i].ms;
          const t = span > 0 ? (targetMs - points[i].ms) / span : 0;
          return points[i].x + t * (points[i + 1].x - points[i].x);
        }
      }
      return points[points.length - 1].x;
    }

    /* only the LABEL gets nudged away from the nearest milestone node —
       the tick itself always stays exactly on its real calendar date */
    function computeLabelOffset(x, milestoneXs, minGap) {
      let nearest = null, nearestDist = Infinity;
      milestoneXs.forEach(mx => {
        const d = Math.abs(x - mx);
        if (d < nearestDist) { nearestDist = d; nearest = mx; }
      });
      if (nearest === null || nearestDist >= minGap) return 0;
      const dir = x >= nearest ? 1 : -1;
      return dir * (minGap - nearestDist);
    }

    let todayIntroStarted = false;

    function updateTodayDot() {
      const now = new Date();
      const nowMs = now.getTime();
      const info = isoWeekInfo(now);

      if (todayBadge) {
        todayBadge.innerHTML = '<span class="pip"></span>Heute &middot; KW <b>' + info.week + '</b>';
      }

      const trackRect = track.getBoundingClientRect();
      const points = nodes.map((node, i) => {
        const r = node.getBoundingClientRect();
        return { ms: milestoneMs[i], x: (r.left + r.width / 2) - trackRect.left };
      });
      if (!points.length) return;
      const milestoneXs = points.map(p => p.x);

      const x = interpolateX(nowMs, points);
      todayDot.title = 'Heute · KW ' + info.week;

      /* the real (final, correct) position is always applied directly —
         that way resize / font-load recalculations just keep it accurate
         with no special-casing. The slide-in is a separate, purely
         decorative effect layered on top via the Web Animations API
         (not a CSS-transition-on-first-paint trick, which is unreliable:
         whether it plays at all depends on exact browser paint/rAF
         timing around page load, and in practice it often got skipped
         entirely). el.animate() runs independently of style/layout
         timing and always plays, so it fires once, right when the real
         "today" position is first known, and is left alone after that —
         later recalculations only touch the plain style, never replay it. */
      todayDot.style.left = x + 'px';
      fill.style.width = x + 'px';

      /* not gated on prefers-reduced-motion: this one-shot entrance is the
         same motion the progress line and the markers already make under
         that setting (see the matching CSS note), so skipping it only for
         the dot made it snap while everything around it glided. */
      if (!todayIntroStarted) {
        todayIntroStarted = true;
        if (!suppressIntro && typeof todayDot.animate === 'function') {
          todayDot.animate([{ left: '0px' }, { left: x + 'px' }], { duration: 700, easing: 'ease' });
          fill.animate([{ width: '0px' }, { width: x + 'px' }], { duration: 700, easing: 'ease' });
        }
      }

      if (yearMarker) {
        const yx = interpolateX(yearStartMs, points);
        yearMarker.style.left = yx + 'px';
        if (yearLabel) {
          yearLabel.style.transform = 'translateX(-50%) translateY(' + YEAR_LABEL_DY + 'px)';
          yearLabel.style.left = YEAR_LABEL_DX + 'px';
        }
      }

      if (bemusterungMarker) {
        if (bemusterungLabel) bemusterungLabel.style.transform = 'translateX(-50%) translateY(' + BEM_LABEL_DY + 'px)';
        if (BEMUSTERUNG_MODE === 'range') {
          const bStartX = interpolateX(bemusterungStartMs, points);
          const bEndX = interpolateX(bemusterungEndMs, points);
          const bWidth = bEndX - bStartX;
          bemusterungMarker.style.left = bStartX + 'px';
          if (bemusterungEndTick) bemusterungEndTick.style.left = bWidth + 'px';
          if (bemusterungLine) bemusterungLine.style.width = bWidth + 'px';
          const mid = bWidth / 2;
          if (bemusterungStem) bemusterungStem.style.left = mid + 'px';
          const off = computeLabelOffset(bStartX + mid, milestoneXs, LABEL_MIN_GAP);
          if (bemusterungLabel) bemusterungLabel.style.left = (mid + off + BEM_LABEL_DX) + 'px';
        } else {
          const bx = interpolateX(bemusterungMs, points);
          bemusterungMarker.style.left = bx + 'px';
          if (bemusterungLabel) bemusterungLabel.style.left = (computeLabelOffset(bx, milestoneXs, LABEL_MIN_GAP) + BEM_LABEL_DX) + 'px';

         and the Bestätigung milestone — not just centered in its own fixed
         grid column — so it always tracks wherever those two real dates fall. */
      if (phase1Step && phase1Card && phase1Stem && typeof BEMUSTERUNG_MODE !== 'undefined') {
        const bemAnchorMs = BEMUSTERUNG_MODE === 'range' ? bemusterungEndMs : bemusterungMs;
        const bemAnchorX = interpolateX(bemAnchorMs, points);
        const bestaetigungX = points[1].x;
        const midX = (bemAnchorX + bestaetigungX) / 2;
        const stepRect = phase1Step.getBoundingClientRect();
        const curCenterX = (stepRect.left - trackRect.left) + stepRect.width / 2;
        const delta = midX - curCenterX;
        phase1Card.style.transform = 'translateX(-50%) translateX(' + delta + 'px)';
        phase1Stem.style.transform = 'translateX(-1px) translateX(' + delta + 'px)';

      steps.forEach((s) => {

        s.classList.toggle('reached', centerX <= x + 0.5);
      });
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(updateTodayDot, 120);
    });

    updateTodayDot();
    window.addEventListener('load', updateTodayDot);
    setTimeout(updateTodayDot, 300);
  })();

  .today-dot::before { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 1px solid rgba(150,200,20,0.55); animation: today-pulse 2.4s ease-out infinite; }
  .today-dot .label { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-size: 9.5px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-deep); white-space: nowrap; pointer-events: none; }
  @keyframes today-pulse { 0% { transform: scale(0.7); opacity: 0.9; } 100% { transform: scale(1.7); opacity: 0; } }

  .step { position: relative; outline: none; width: var(--w); }
  .step .card { position: absolute; left: 50%; transform: translateX(-50%); width: 190px; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 14px 18px; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 10px; opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.25s ease, background 0.25s ease; }
  .step:not(.in-view) .card { transform: translateX(-50%) translateY(10px); }
  .step.in-view .card { opacity: 1; }
  .milestone .card { bottom: calc(50% + 72px); height: 176px; }
  .phase .card { top: calc(50% + 40px); height: 96px; justify-content: center; }
  .step:hover .card, .step:focus-within .card { border-color: var(--accent-deep); background: var(--bg-panel-hover); }

  .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-deep); font-weight: 700; display: block; }
  .value { font-family: var(--font-display); font-weight: 400; font-size: 19px; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; display: block; }
  .month { font-size: 10.5px; color: var(--stone); letter-spacing: 0.02em; display: block; }
  .desc { font-size: 12.5px; line-height: 1.45; color: var(--stone); margin: 2px 0 0; }

  .stem { position: absolute; left: 50%; width: 2px; transform: translateX(-1px); background: var(--line); transition: background 0.25s ease; }
  .milestone .stem { top: calc(50% - 32px - 40px); height: 40px; }
  .phase .stem { top: 50%; height: 40px; }
  .step:hover .stem, .step:focus-within .stem { background: var(--accent-deep); }
  .step.reached .stem { background: var(--accent-deep); }

  .node { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--bg); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--accent-deep); cursor: default; transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, color 0.25s ease, background 0.25s ease; z-index: 2; }
  .node svg { width: 24px; height: 24px; }
  .milestone:hover .node, .milestone:focus-within .node { border-color: var(--accent-deep); transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 0 6px rgba(150,200,20,0.16); }
  .milestone.reached .node { border-color: var(--accent-deep); color: #ffffff; background: var(--accent); box-shadow: 0 0 0 8px rgba(150,200,20,0.22); }
  .milestone.reached:hover .node, .milestone.reached:focus-within .node { transform: translate(-50%, -50%) scale(1.08); }
  .node:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

${MARKER_CSS}

  footer { padding: 18px clamp(20px, 6vw, 72px) clamp(24px, 4vw, 40px); max-width: 1400px; width: 100%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  footer .note { font-size: 11.5px; color: var(--stone); letter-spacing: 0.02em; }

  /* the hint wording follows the INPUT DEVICE, not the screen width: a
     tablet is wide enough to miss the 640px breakpoint but still has no
     mouse to "drag" with. */
  @media (hover: none) and (pointer: coarse) {
    .nav-hint .hint-pointer { display: none; }
    .nav-hint .hint-touch { display: inline; }
  }

  @media (prefers-reduced-motion: reduce) {
    .step .card { transition: opacity 0.2s ease; }
    .step:not(.in-view) .card { transform: translateX(-50%); }
    .node, .scroll-btn { transition: none; }
    /* the today-dot keeps its transition here on purpose: its slide-in is a
       single short one-shot entrance, and the progress line + the year /
       Bemusterungstage markers it travels with animate under this media
       query too — killing only the dot's transition left it snapping to
       its position while everything around it glided, which read as a bug.
       The genuinely motion-sensitive part, the infinitely repeating pulse
       ring, stays disabled below. */
    .today-dot::before { animation: none; display: none; }
  }

  @media (max-width: 640px) {
    /* Cards, nodes, stems, type sizes and marker labels are left at their
       desktop values on purpose — the timeline reads identically, it is
       only shorter horizontally and the track is trimmed vertically.
       510px is close to the 496px floor the desktop card geometry needs
       (72px gap + 176px card above the centre line, mirrored below). */
    .timeline-track { column-gap: 16px; height: 510px; }
    .step { width: calc(var(--w) * 0.65); }
    /* the hint row stays: hiding it outright also hid the "Heute" badge,
       which is the one piece of live information on the page. Only the
       mouse/keyboard wording is swapped for a swipe hint. */
    .nav-hint { margin-top: 18px; font-size: 11px; gap: 8px; }
    .nav-hint .hint-pointer { display: none; }
    .nav-hint .hint-touch { display: inline; }
    /* on a phone there is no room to push the arrows to the far edge, so
       the hint, the badge and the arrows sit together as one group */
    .nav-hint .controls { margin-left: 0; gap: 10px; }
    .scroll-btn { width: 34px; height: 34px; }
    .scroll-btn svg { width: 14px; height: 14px; }
    /* the track reserves room for a card above and below the line; on a
       phone the cards are shorter, so the desktop reserve left a large
       empty band under the timeline. */
    .timeline-section { padding: 8px 0 12px; }
    header { padding-bottom: 0; }
  }

  /* smallest phones (iPhone SE and similar): shave the row down just
     enough that the hint, the badge and the arrows still share one line. */
  @media (max-width: 360px) {
    .nav-hint { gap: 6px; font-size: 10px; }
    .nav-hint .controls { gap: 8px; }
    .scroll-btn { width: 30px; height: 30px; }

    .today-badge { font-size: 10.5px; padding: 2px 8px 2px 6px; gap: 5px; }
    .today-badge .pip { width: 7px; height: 7px; }
  }
</style>

  }

  /* =====================================================================
     EDITOR WIRING
     ===================================================================== */

  const state = {
    style: 'mdh',
    projectName: 'Musterprojekt',
    anschriftPart1: 'Familie',
    anschriftPart2: 'Muster',
    milestones: {
      werkvertrag: { year: 2026, week: 20 },
      bestaetigung: { year: 2026, week: 40 },
      planversand: { year: 2027, week: 4 },
      baubeginn: { year: 2027, week: 10 }
    },
    bemusterung: { mode: 'range', startYear: 2026, startWeek: 26, endYear: 2026, endWeek: 30 },
    bemLabelDX: 0,
    bemLabelDY: 0,
    yearLabelDX: 0,
    yearLabelDY: 0
  };

  const els = {
    styleMdh: document.getElementById('style-mdh'),
    styleFh: document.getElementById('style-fh'),
    fieldProjectName: document.getElementById('field-project-name'),
    inputProjectName: document.getElementById('input-project-name'),
    inputAnschrift1: document.getElementById('input-anschrift-1'),
    inputAnschrift2: document.getElementById('input-anschrift-2'),
    modeSingle: document.getElementById('mode-single'),
    modeRange: document.getElementById('mode-range'),
    bemEndRow: document.getElementById('bem-end-row'),
    bemStartLabel: document.getElementById('bem-start-label'),
    bemLabelDx: document.getElementById('bem-label-dx'),
    bemLabelDy: document.getElementById('bem-label-dy'),
    bemLabelReset: document.getElementById('bem-label-reset'),
    yearLabelDx: document.getElementById('year-label-dx'),
    yearLabelDy: document.getElementById('year-label-dy'),
    yearLabelReset: document.getElementById('year-label-reset'),
    frame: document.getElementById('preview-frame'),
    btnHtml: document.getElementById('btn-html'),
    btnPdf: document.getElementById('btn-pdf')
  };

  function readForm() {
    state.projectName = els.inputProjectName.value;
    state.anschriftPart1 = els.inputAnschrift1.value;
    state.anschriftPart2 = els.inputAnschrift2.value;
    ['werkvertrag', 'bestaetigung', 'planversand', 'baubeginn'].forEach(key => {
      state.milestones[key].week = parseInt(document.getElementById('ms-' + key + '-week').value, 10) || 1;
      state.milestones[key].year = parseInt(document.getElementById('ms-' + key + '-year').value, 10) || 2026;
    });
    state.bemusterung.startWeek = parseInt(document.getElementById('bem-start-week').value, 10) || 1;
    state.bemusterung.startYear = parseInt(document.getElementById('bem-start-year').value, 10) || 2026;
    state.bemusterung.endWeek = parseInt(document.getElementById('bem-end-week').value, 10) || 1;
    state.bemusterung.endYear = parseInt(document.getElementById('bem-end-year').value, 10) || 2026;
    state.bemLabelDX = parseInt(els.bemLabelDx.value, 10) || 0;
    state.bemLabelDY = parseInt(els.bemLabelDy.value, 10) || 0;
    state.yearLabelDX = parseInt(els.yearLabelDx.value, 10) || 0;
    state.yearLabelDY = parseInt(els.yearLabelDy.value, 10) || 0;
  }

  function currentHtml() {
    return state.style === 'mdh' ? buildMDH(state) : buildFH(state);
  }

  /* CSS appended ONLY to the live preview / PDF capture — never to the
     downloaded HTML file, which keeps its real transitions/animations. */
  function noAnimCss() {
    return '<style>*,*::before,*::after{transition:none !important;animation:none !important;}</style>';
  }

  /* forces every card fully visible (via the SAME "in-view" class the
     scroll-reveal observer would add, so it doesn't fight the phase-1
     re-centering transform applied at runtime), un-clips the horizontally
     scrollable timeline, drops the min-height:100vh so the page's true
     content height can be measured accurately, and pins every element to
     one safe font stack — the brand webfonts live on marty-designhaus.ch /
     freshhaus.ch without CORS headers, so html2canvas's isolated render
     pass can't fetch them and ends up mixing metrics from two different
     fonts mid-paragraph, which is what caused the stretched/justified-
     looking word spacing. Used only for the exact-replica PDF capture. */
  function forceVisibleCss() {
    return '<style>' +
      '*{font-family:-apple-system,"Segoe UI",Arial,sans-serif !important;text-wrap:normal !important;}' +
      '.today-dot::before{display:none !important;}' +
      '.timeline-wrap{overflow:visible !important;mask-image:none !important;}' +
      'body{min-height:0 !important;}' +
      '</style>' +
      '<script>document.querySelectorAll(".step").forEach(function(s){ s.classList.add("in-view"); });<\/script>';
  }

  /* prepended so it parses and runs before the runtime script further
     down the document — flips the today-dot's intro animation off
     (see the RUNTIME_JS suppressIntro comment). Must come first in the
     string, not just be appended anywhere, since script order is what
     guarantees it's seen in time. */
  const SUPPRESS_INTRO_MARKER = '<script>window.__BAUABLAUF_SUPPRESS_INTRO__=true;<\/script>';

  function previewHtml() {
    return SUPPRESS_INTRO_MARKER + currentHtml() + noAnimCss();
  }

  function captureHtml() {
    return SUPPRESS_INTRO_MARKER + currentHtml() + noAnimCss() + forceVisibleCss();
  }

  function render() {
    readForm();
    els.frame.srcdoc = previewHtml();
  }

  /* the editor panel wears the same brand as the timeline being edited */
  function applyPanelTheme() {
    document.body.classList.toggle('theme-fh', state.style === 'fh');
  }

  els.styleMdh.addEventListener('click', () => {
    state.style = 'mdh';
    els.styleMdh.classList.add('active');
    els.styleFh.classList.remove('active');
    els.fieldProjectName.style.display = '';
    applyPanelTheme();
    render();
  });
  els.styleFh.addEventListener('click', () => {
    state.style = 'fh';
    els.styleFh.classList.add('active');
    els.styleMdh.classList.remove('active');
    els.fieldProjectName.style.display = 'none';
    applyPanelTheme();
    render();
  });

  els.modeSingle.addEventListener('click', () => {
    state.bemusterung.mode = 'single';
    els.modeSingle.classList.add('active');
    els.modeRange.classList.remove('active');
    els.bemEndRow.style.display = 'none';
    els.bemStartLabel.textContent = 'KW';
    render();
  });
  els.modeRange.addEventListener('click', () => {
    state.bemusterung.mode = 'range';
    els.modeRange.classList.add('active');
    els.modeSingle.classList.remove('active');
    els.bemEndRow.style.display = '';
    els.bemStartLabel.textContent = 'Start KW';
    render();
  });

  document.querySelectorAll('.panel input').forEach(el => {
    el.addEventListener('input', render);
  });

  els.bemLabelReset.addEventListener('click', () => {
    els.bemLabelDx.value = 0;
    els.bemLabelDy.value = 0;
    render();
  });
  els.yearLabelReset.addEventListener('click', () => {
    els.yearLabelDx.value = 0;
    els.yearLabelDy.value = 0;
    render();
  });

  function exportName() {
    return state.style === 'mdh' ? (state.projectName || 'villa') : (anschriftText(state) || 'kunde');
  }

  els.btnHtml.addEventListener('click', () => {
    readForm();
    const html = currentHtml();
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = exportName().toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_bauablauf.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  /* renders the exact generated HTML file (unclipped + un-animated) into a
     hidden same-origin iframe, so the captured canvas is a pixel-for-pixel
     replica of the real page — not a separate summary layout. Width is
     fixed: the timeline's own layout is a constant pixel width by design,
     and a fixed width keeps every clamp()-based font-size/padding at the
     same "settled" desktop value every time. Height is MEASURED (with the
     min-height:100vh floor removed via forceVisibleCss) because the real
     header text height depends on which webfont ends up loading — a fixed
     guess there is what made the footer get cut off before. */
  const CAPTURE_W = 1800;
  const MEASURE_H = 1600;

  function createCaptureFrame(html, w, h) {
    return new Promise((resolve) => {
      const frame = document.createElement('iframe');
      frame.style.position = 'fixed';
      frame.style.left = '-99999px';
      frame.style.top = '0';
      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
      frame.style.border = 'none';
      frame.setAttribute('aria-hidden', 'true');
      document.body.appendChild(frame);
      frame.addEventListener('load', () => resolve(frame), { once: true });
      frame.srcdoc = html;
    });
  }

  els.btnPdf.addEventListener('click', async () => {
    readForm();
    els.btnPdf.disabled = true;
    const originalLabel = els.btnPdf.textContent;
    els.btnPdf.textContent = '…';
    let frame;
    try {
      frame = await createCaptureFrame(captureHtml(), CAPTURE_W, MEASURE_H);
      const fdoc = frame.contentDocument;
      if (fdoc.fonts && fdoc.fonts.ready) {
        try { await fdoc.fonts.ready; } catch (e) { /* ignore */ }
      }
      await new Promise(r => setTimeout(r, 250));
      const fullH = Math.max(1, Math.ceil(fdoc.body.scrollHeight));

      const canvas = await html2canvas(fdoc.body, {
        width: CAPTURE_W,
        height: fullH,
        windowWidth: CAPTURE_W,
        windowHeight: fullH,
        scale: 2,
        useCORS: true
      });

      /* JPEG rather than PNG: jsPDF embeds a JPEG byte-for-byte (native PDF
         DCTDecode filter) but has to re-encode a PNG as a raw bitmap, which
         made this a ~30MB file for a handful of megapixels — JPEG keeps it
         a few hundred KB with no visible quality loss on this flat, mostly
         line/text artwork. */
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const { jsPDF } = window.jspdf;

      /* the page is a true A4 landscape sheet (841.89 × 595.28pt). The
         timeline is proportionally wider than A4, so it is scaled to fit
         INSIDE the sheet — never cropped — and then centred on both axes,
         which is what makes the top and bottom margins exactly equal.
         (The general form below also handles a capture that is taller
         than A4, where it fits to height and centres left/right instead.) */
      const A4_W = 841.89;
      const A4_H = 595.28;
      const ratio = canvas.width / canvas.height;
      let drawW, drawH;
      if (ratio >= A4_W / A4_H) {
        drawW = A4_W;
        drawH = A4_W / ratio;
      } else {
        drawH = A4_H;
        drawW = A4_H * ratio;
      }
      const offsetX = (A4_W - drawW) / 2;
      const offsetY = (A4_H - drawH) / 2;

      const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'landscape' });

      /* paint the whole sheet in the timeline's own background colour first,
         so the bands left over by the centring read as part of the design
         instead of as white strips above and below a dark page. Taken from
         the rendered document rather than hard-coded, so it stays correct
         if either skin's background ever changes. */
      let pageBg = [255, 255, 255];
      try {
        const m = frame.contentWindow.getComputedStyle(fdoc.body).backgroundColor.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
        if (m) pageBg = [Number(m[1]), Number(m[2]), Number(m[3])];
      } catch (e) { /* keep the white default */ }
      pdf.setFillColor(pageBg[0], pageBg[1], pageBg[2]);
      pdf.rect(0, 0, A4_W, A4_H, 'F');

      pdf.addImage(imgData, 'JPEG', offsetX, offsetY, drawW, drawH);
      pdf.save(exportName().toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_bauablauf.pdf');
    } finally {
      if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
      els.btnPdf.disabled = false;
      els.btnPdf.textContent = originalLabel;
    }
  });

  els.fieldProjectName.style.display = '';
  applyPanelTheme();
  render();
})();
</script>
